name: wlget
arch: ${PACKAGE_ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Wikilayer <info@wikilayer.org>
vendor: Wikilayer
homepage: https://github.com/wikilayer/wlget
license: MIT
description: |
  prints a Wikilayer page, wiki or chat in the terminal
  wlget reads a Wikilayer address and prints what a browser signed in to your
  account would get there: a page as Markdown, a chat message as it arrives.
contents:
  - src: dist/package/wlget
    dst: /usr/bin/wlget
  - src: LICENSE
    dst: /usr/share/doc/wlget/copyright

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "releases must be dispatched from main" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like 0.7.1" >&2
            exit 1
          fi
          CHANGELOG_VERSION="$(sed -n 's/^## \([0-9][0-9.]*\).*$/\1/p' CHANGELOG.md | head -1)"
          if [[ "$VERSION" != "$CHANGELOG_VERSION" ]]; then
            echo "version must match the latest CHANGELOG entry: $CHANGELOG_VERSION" >&2
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tools
        run: make install-tools
      - name: Build
        run: make build
      - name: Build Linux packages
        env:
          VERSION: ${{ inputs.version }}
        run: make packages VERSION="$VERSION"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          NOTES="$(sed -n "/^## ${VERSION} /,/^## /p" CHANGELOG.md | sed '1d;$d')"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes "$NOTES" \
            dist/*.tar.gz dist/*.deb dist/*.sha256
